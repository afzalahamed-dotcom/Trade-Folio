<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFolio Master</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-bg: #f8fafc;
      --theme-card-bg: rgba(255, 255, 255, 0.7);
      --theme-text: #0f172a;
      --theme-primary: #4f46e5;
      --theme-secondary: #059669;
      --theme-accent: #e11d48;
    }
    
    html, body {
      height: 100%;
      margin: 0;
      background-color: var(--theme-bg);
      color: var(--theme-text);
      transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    .font-mono-terminal {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Professional Light Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--theme-primary);
    }

    /* Soft Light Scanline Effect */
    .scanline-container::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(255, 255, 255, 0) 50%, rgba(255, 255, 255, 0.2) 50%), 
                  linear-gradient(90deg, rgba(255, 255, 255, 0.02), rgba(0, 0, 0, 0.01), rgba(255, 255, 255, 0.02));
      z-index: 2;
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      opacity: 0.3;
    }

    .glass-morphism {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--theme-card-bg);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
    }

    .text-glow-green {
      text-shadow: 0 0 8px rgba(16, 185, 129, 0.2);
    }

    .text-glow-coral {
      text-shadow: 0 0 8px rgba(225, 29, 72, 0.2);
    }

    .theme-transition {
      transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
<script type="importmap">
{

  }
}
